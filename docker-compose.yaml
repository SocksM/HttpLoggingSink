services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elasticsearch
    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    networks:
      - elastic

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    ports:
      - "127.0.0.1:9200:9200"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  elasticsearch-init:
    image: curlimages/curl:8.16.0
    container_name: elasticsearch-init
    restart: "no"

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - elastic

    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      HTTPLOGGINGSINK_PASSWORD: ${HTTPLOGGINGSINK_PASSWORD}

    entrypoint: ["/bin/sh", "-c"]

    command: |
      set -e
      echo "Configuring Elasticsearch..."

      curl -fsS \
        -u "elastic:$${ELASTIC_PASSWORD}" \
        -X PUT \
        "http://elasticsearch:9200/_security/user/kibana_system/_password" \
        -H "Content-Type: application/json" \
        -d "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}"

      curl -fsS \
        -u "elastic:$${ELASTIC_PASSWORD}" \
        -X PUT \
        "http://elasticsearch:9200/_security/role/httploggingsink" \
        -H "Content-Type: application/json" \
        -d '{
          "cluster": ["manage"],
          "indices": [
            {
              "names": ["logs-http-log-*"],
              "privileges": ["create_index", "create", "index", "write"]
            }
          ]
        }'

      curl -fsS \
        -u "elastic:$${ELASTIC_PASSWORD}" \
        -X PUT \
        "http://elasticsearch:9200/_security/user/httploggingsink" \
        -H "Content-Type: application/json" \
        -d "{\"password\":\"$${HTTPLOGGINGSINK_PASSWORD}\",\"roles\":[\"httploggingsink\"]}"

      echo "Elasticsearch configuration complete."

  http-logging-sink:
    image: ghcr.io/socksm/http-logging-sink-main:latest
    container_name: http-logging-sink
    restart: unless-stopped

    environment:
      - ElasticSearch__Uri=http://elasticsearch:9200
      - ElasticSearch__Username=httploggingsink
      - ElasticSearch__Password=${HTTPLOGGINGSINK_PASSWORD}

    ports:
      - "62847:8080"

    networks:
      - elastic

    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: kibana
    restart: unless-stopped

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}

    ports:
      - "5601:5601"

    networks:
      - elastic

    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully

networks:
  elastic:
    driver: bridge

volumes:
  elasticsearch-data:
